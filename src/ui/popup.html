<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Readela</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Readela</h1>
        <label class="switch" for="enabled">
          <span id="enabled-label" aria-hidden="true">On</span>
          <input type="checkbox" role="switch" id="enabled" aria-label="Readela" aria-describedby="state-note" />
        </label>
      </header>
      <p class="note" id="state-note">Original keeps that part as the site shows it.</p>

      <fieldset id="settings" class="settings">
        <legend class="hidden">Reading settings</legend>

        <fieldset class="group" aria-describedby="direction-hint">
          <legend>Direction</legend>
          <div class="segments">
            <label><input type="radio" name="direction" value="page" /><span>Original</span></label>
            <label><input type="radio" name="direction" value="auto" /><span>Auto</span></label>
            <label><input type="radio" name="direction" value="rtl" aria-label="RTL, right to left" /><span>RTL</span></label>
            <label><input type="radio" name="direction" value="ltr" aria-label="LTR, left to right" /><span>LTR</span></label>
          </div>
          <p class="hint" id="direction-hint"></p>
        </fieldset>

        <fieldset class="group" aria-describedby="theme-hint">
          <legend>Reading appearance</legend>
          <div class="segments">
            <label><input type="radio" name="theme" value="page" /><span>Original</span></label>
            <label><input type="radio" name="theme" value="paper" /><span>Paper</span></label>
            <label><input type="radio" name="theme" value="night" /><span>Night</span></label>
          </div>
          <p class="hint" id="theme-hint"></p>
        </fieldset>

        <fieldset class="group" aria-describedby="font-hint">
          <legend>Font</legend>
          <div class="segments">
            <label><input type="radio" name="font" value="page" /><span>Original</span></label>
            <label><input type="radio" name="font" value="sans" /><span>Readela Sans</span></label>
          </div>
          <p class="hint" id="font-hint"></p>
        </fieldset>

        <fieldset class="group">
          <legend>Text size</legend>
          <div class="segments">
            <label><input type="radio" name="size" value="page" /><span>Original</span></label>
            <label><input type="radio" name="size" value="110" /><span>110%</span></label>
            <label><input type="radio" name="size" value="125" /><span>125%</span></label>
            <label><input type="radio" name="size" value="140" /><span>140%</span></label>
          </div>
        </fieldset>

        <fieldset class="group">
          <legend>Line spacing</legend>
          <div class="segments">
            <label><input type="radio" name="spacing" value="page" /><span>Original</span></label>
            <label><input type="radio" name="spacing" value="1.6" /><span>1.6</span></label>
            <label><input type="radio" name="spacing" value="1.9" /><span>1.9</span></label>
            <label><input type="radio" name="spacing" value="2.2" /><span>2.2</span></label>
          </div>
        </fieldset>
      </fieldset>

      <section class="mark" aria-labelledby="mark-title">
        <h2 id="mark-title">Reading mark</h2>
        <div class="actions">
          <button type="button" id="mark-set" title="Marks the paragraph you selected, or the first one in view">Mark here</button>
          <button type="button" id="mark-go" title="Scrolls back to the marked paragraph">Go to mark</button>
          <button type="button" id="mark-clear" class="quiet" title="Removes the mark from this conversation">Clear</button>
        </div>
        <p class="hint" id="mark-note" role="status" aria-live="polite"></p>
      </section>

      <footer>
        <div class="foot">
          <button type="button" id="reset" class="quiet">Reset settings</button>
          <span class="by">Amir42 · <span id="version"></span></span>
        </div>
        <p class="note" id="status" role="status" aria-live="polite"></p>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
